<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<!-- Paylaşım görseli şablonu (1200×630). scripts/og_gorsel.mjs bunu PNG'ye çevirir → site/assets/og.png -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:Outfit,system-ui,sans-serif;color:#eef7f2;
    background:radial-gradient(700px 420px at 18% 10%,rgba(61,220,151,.28),transparent 70%),radial-gradient(600px 400px at 95% 100%,rgba(167,139,250,.22),transparent 70%),#050505}
  .k{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:700;letter-spacing:-.02em}
  .mark{width:46px;height:46px;border-radius:13px;background:#3DDC97;position:relative}
  .mark::after{content:"";position:absolute;inset:10px;border-radius:5px;background:#050505}
  .logo b{color:#3DDC97}
  h1{margin-top:58px;font-size:72px;line-height:1.04;font-weight:800;letter-spacing:-.035em}
  h1 span{background:linear-gradient(90deg,#3DDC97,#8ff0c6);-webkit-background-clip:text;color:transparent}
  p{margin-top:22px;font-size:28px;color:#b9c6c0;max-width:900px;line-height:1.35}
  .alt{margin-top:auto;display:flex;gap:14px}
  .r{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font-size:22px;font-weight:600}
  .r.y{border-color:rgba(61,220,151,.55);color:#9ff3cf}
</style></head>
<body><div class="k">
  <div class="logo"><span class="mark"></span>Gerisi <b>Bende</b></div>
  <h1>Tekrar eden iş,<br><span>artık sizin işiniz değil.</span></h1>
  <p>226 meslek için hazır kod blokları ve AI agent'lar. Sen kahveni iç, gerisi bende.</p>
  <div class="alt"><span class="r y">Ücretsiz</span><span class="r">Açık kaynak</span><span class="r">Türkçe</span><span class="r">466 hazır paket</span></div>
</div></body></html>
