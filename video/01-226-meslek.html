<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<!-- Video 01 — "226 meslek bitti… angaryası" (1080×1920, 22 sn). render.mjs her kare için window.render(t) çağırır.
     Tarayıcıda açınca kendi kendine oynar (önizleme). -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#050505}
  body{font-family:Outfit,system-ui,sans-serif;color:#F2F2F0;-webkit-font-smoothing:antialiased}
  #bg{position:absolute;inset:0}
  .glow{position:absolute;border-radius:50%;filter:blur(40px)}
  #g1{width:1100px;height:1100px;background:radial-gradient(closest-side,rgba(61,220,151,.30),transparent)}
  #g2{width:1000px;height:1000px;background:radial-gradient(closest-side,rgba(167,139,250,.20),transparent)}
  #grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px}
  #stage{position:absolute;inset:0}
  .sc{position:absolute;inset:0;display:none}
  .abs{position:absolute;left:0;right:0;text-align:center;will-change:transform,opacity}
  .w{font-weight:800;letter-spacing:-.045em;line-height:1}
  .g{background:linear-gradient(90deg,#3DDC97,#8FF0CB);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mono{font-family:"Geist Mono",Consolas,monospace}

  /* S1/S2 */
  #n226{top:330px;font-size:420px;font-weight:900;letter-spacing:-.06em}
  #wMeslek,#wMeslegin{top:820px;font-size:170px}
  #strike{position:absolute;top:900px;left:150px;height:16px;border-radius:8px;background:#3DDC97;box-shadow:0 0 30px rgba(61,220,151,.8);transform-origin:left center}
  #wAngarya{top:1010px;font-size:170px}
  #wBitti{top:1010px;font-size:170px}
  #flash{position:absolute;inset:0;background:#3DDC97;opacity:0;mix-blend-mode:screen}

  /* S3 */
  .big{font-size:132px;font-weight:800;letter-spacing:-.045em;line-height:1.02}
  .lbl{font-size:44px;font-weight:600;color:#ADADB3;letter-spacing:.02em}

  /* S4 */
  #s4h{top:250px}
  .card{position:absolute;left:90px;right:90px;height:118px;border-radius:28px;background:#0E0E10;
    box-shadow:0 0 0 1px rgba(255,255,255,.09),inset 0 1px 1px rgba(255,255,255,.10),0 30px 80px rgba(0,0,0,.6);
    display:flex;align-items:center;padding:0 40px;gap:28px;font-size:46px;font-weight:600;letter-spacing:-.02em}
  .card .ic{width:58px;height:58px;border-radius:50%;flex:none;border:3px solid rgba(255,255,255,.18);position:relative}
  .card .ic svg{position:absolute;inset:0}
  .card .tag{margin-left:auto;font-size:26px;font-weight:600;padding:8px 16px;border-radius:999px;letter-spacing:.02em}
  .tag.k{color:#9ff3cf;background:rgba(61,220,151,.12)}
  .tag.a{color:#d9ccff;background:rgba(167,139,250,.16)}
  #s4more{top:1640px;font-size:48px;font-weight:600;color:#ADADB3}

  /* S5 */
  .stat{position:absolute;left:90px;right:90px;display:flex;align-items:baseline;gap:30px}
  .stat .v{font-size:250px;font-weight:900;letter-spacing:-.06em;line-height:1;min-width:560px;text-align:right}
  .stat .u{font-size:64px;font-weight:700;color:#ADADB3;letter-spacing:-.02em;white-space:nowrap}
  .chips{position:absolute;top:1540px;left:0;right:0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:0 60px}
  .chip{padding:16px 30px;border-radius:999px;font-size:40px;font-weight:600;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04)}
  .chip.y{border-color:rgba(61,220,151,.6);color:#9ff3cf}

  /* S6 */
  #cup{position:absolute;left:390px;top:300px;width:300px;height:300px}
  #logo{top:1500px;display:flex;justify-content:center;align-items:center;gap:26px;font-size:76px;font-weight:700;letter-spacing:-.02em}
  .mark{width:84px;height:84px;border-radius:24px;background:#3DDC97;position:relative}
  .mark::after{content:"";position:absolute;inset:18px;border-radius:9px;background:#050505}
  #url{top:1640px;font-size:52px;font-weight:500;color:#ADADB3;letter-spacing:.01em}

  #bar{position:absolute;left:0;bottom:0;height:10px;background:linear-gradient(90deg,#3DDC97,#8FF0CB)}
</style></head>
<body>
<div id="bg"><div id="grid"></div><div class="glow" id="g1"></div><div class="glow" id="g2"></div></div>
<div id="stage">

  <!-- S1+S2: hook ve dönüş -->
  <div class="sc" id="s1">
    <div class="abs" id="n226">0</div>
    <div class="abs w" id="wMeslek">MESLEK</div>
    <div id="strike"></div>
    <div class="abs w" id="wMeslegin">MESLEĞİN</div>
    <div class="abs w g" id="wAngarya">ANGARYASI</div>
    <div class="abs w" id="wBitti">BİTTİ.</div>
  </div>

  <!-- S3: güven -->
  <div class="sc" id="s3">
    <div class="abs lbl" id="s3a0" style="top:640px">Merak etmeyin,</div>
    <div class="abs big" id="s3a1" style="top:740px">Meslek</div>
    <div class="abs big" id="s3a2" style="top:880px">sizde kalıyor.</div>
    <div class="abs lbl" id="s3b0" style="top:640px">Tekrar eden işler mi?</div>
    <div class="abs big" id="s3b1" style="top:740px">Onlar</div>
    <div class="abs big g" id="s3b2" style="top:880px">bende.</div>
  </div>

  <!-- S4: görev kartları -->
  <div class="sc" id="s4">
    <div class="abs lbl" id="s4h">Mesela şunlar:</div>
    <div id="cards"></div>
    <div class="abs" id="s4more">+ 459 hazır paket daha</div>
  </div>

  <!-- S5: rakamlar -->
  <div class="sc" id="s5">
    <div class="stat" id="st0" style="top:330px"><span class="v g">0</span><span class="u">hazır paket</span></div>
    <div class="stat" id="st1" style="top:690px"><span class="v">0</span><span class="u">rol</span></div>
    <div class="stat" id="st2" style="top:1050px"><span class="v">0</span><span class="u">sektör</span></div>
    <div class="chips"><span class="chip y" id="c0">Ücretsiz</span><span class="chip" id="c1">Açık kaynak</span><span class="chip" id="c2">Son söz sizde</span></div>
  </div>

  <!-- S6: kapanış -->
  <div class="sc" id="s6">
    <svg id="cup" viewBox="0 0 300 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="st_a" d="M110 120 C 95 95, 125 80, 110 55" stroke="#ADADB3" stroke-width="10"/>
      <path id="st_b" d="M150 120 C 135 95, 165 80, 150 55" stroke="#ADADB3" stroke-width="10"/>
      <path id="st_c" d="M190 120 C 175 95, 205 80, 190 55" stroke="#ADADB3" stroke-width="10"/>
      <path d="M70 150 H230 V200 A60 60 0 0 1 170 260 H130 A60 60 0 0 1 70 200 Z" stroke="#3DDC97" stroke-width="14"/>
      <path d="M230 165 H250 A28 28 0 0 1 250 221 H226" stroke="#3DDC97" stroke-width="14"/>
    </svg>
    <div class="abs big" id="s6a" style="top:760px">Sen kahveni iç,</div>
    <div class="abs big g" id="s6b" style="top:910px">gerisi bende.</div>
    <div class="abs" id="logo"><span class="mark"></span><span>Gerisi <b style="color:#3DDC97">Bende</b></span></div>
    <div class="abs" id="url">gerisibende.com</div>
  </div>

  <div id="flash"></div>
</div>
<div id="bar"></div>

<script>
const DUR = 22, FPS = 30;
const $ = id => document.getElementById(id);

// ---- yardımcılar ----
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - k, 3);                 // easeOutCubic
const ex = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);  // easeOutExpo
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const show = (id, on) => { $(id).style.display = on ? "block" : "none"; };
function set(el, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1, blur = 0 } = {}) {
  if (typeof el === "string") el = $(el);
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx ?? s},${sy ?? s})`;
  el.style.opacity = o;
  el.style.filter = blur > .05 ? `blur(${blur}px)` : "none";
}
// "slam": büyükten küçüğe çarpma girişi
const slam = (t, a, d = .28) => { const k = p(t, a, a + d); return { s: lerp(2.6, 1, ex(k)), o: cl(k * 3), blur: (1 - k) * 18 }; };
// kelime kelime yukarıdan blur'la gelen giriş
const rise = (t, a, d = .45) => { const k = eo(p(t, a, a + d)); return { y: (1 - k) * 90, o: k, blur: (1 - k) * 14 }; };
const leave = (t, a, d = .35) => { const k = eio(p(t, a, a + d)); return { y: -k * 140, o: 1 - k, blur: k * 16 }; };

// ---- S4 kartları (gerçek paket adları) ----
const TASKS = [
  ["e-Fatura XML → Excel", "k"],
  ["Brüt–net bordro hesabı", "k"],
  ["Kıdem ve ihbar tazminatı", "k"],
  ["Cari hesap mutabakatı", "k"],
  ["TCKN / VKN / IBAN kontrolü", "k"],
  ["PDF faturadan bilgi çıkarma", "a"],
  ["Müşteri yorum analizi", "a"],
  ["İş ilanı + mülakat soruları", "a"],
];
const CARD0 = 390, CARD_GAP = 146, CARD_T0 = 8.75, CARD_DT = .5;
const cardsEl = $("cards");
const cards = TASKS.map(([txt, kind], i) => {
  const d = document.createElement("div");
  d.className = "card";
  d.style.top = (CARD0 + i * CARD_GAP) + "px";
  d.innerHTML = `<span class="ic"><svg viewBox="0 0 58 58"><circle cx="26" cy="26" r="26" fill="none"/><path d="M15 27 L23 35 L38 19" stroke="${kind === "k" ? "#3DDC97" : "#A78BFA"}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40"/></svg></span><span>${txt}</span><span class="tag ${kind}">${kind === "k" ? "kod" : "agent"}</span>`;
  cardsEl.appendChild(d);
  return d;
});

// ---- sarsıntı: her "slam" anında sönümlenen titreşim ----
const HITS = [[.95, 22], [1.25, 30], [1.6, 30], [3.85, 26]];
function shake(t) {
  let x = 0, y = 0;
  for (const [a, amp] of HITS) {
    const d = t - a; if (d < 0 || d > .45) continue;
    const f = amp * Math.exp(-d * 11);
    x += Math.sin(d * 90) * f; y += Math.cos(d * 75) * f * .7;
  }
  return [x, y];
}

function render(t) {
  // arka plan
  set("g1", { x: 80 + Math.sin(t * .45) * 160, y: -260 + Math.cos(t * .35) * 120 });
  set("g2", { x: 300 + Math.cos(t * .4) * 140, y: 1150 + Math.sin(t * .3) * 140 });
  set("grid", { y: (t * 18) % 90, x: 0 });
  const [sx, sy] = shake(t);
  $("stage").style.transform = `translate(${sx}px,${sy}px)`;
  $("bar").style.width = (t / DUR * 100) + "%";
  // flaş
  const fl = Math.max(0, 1 - Math.abs(t - 3.85) / .12) * .22 + Math.max(0, 1 - Math.abs(t - 8.45) / .12) * .12;
  $("flash").style.opacity = fl;

  // ================= S1 + S2 (0 – 5.4) =================
  show("s1", t < 5.6);
  if (t < 5.6) {
    // 226 sayacı
    const cnt = Math.round(226 * ex(p(t, 0, .95)));
    $("n226").textContent = cnt;
    const nk = p(t, .95, 1.25);
    const punch = 1 + Math.sin(nk * Math.PI) * .08;
    const ns = lerp(.6, 1, eo(p(t, 0, .5)));
    // S2'de 226 biraz yukarı ve küçülür
    const up = eio(p(t, 3.3, 3.8));
    const out = leave(t, 5.15);
    set("n226", { s: ns * punch * lerp(1, .78, up), y: lerp(0, -40, up) + out.y, o: cl(t * 6) * out.o, blur: out.blur });

    // MESLEK: slam → glitch → üstü çizilir → sola kayar
    const m = slam(t, 1.0);
    const gl = t > 2.25 && t < 2.75;
    const mOut = eio(p(t, 3.3, 3.65));
    set("wMeslek", { s: m.s, o: m.o * (1 - mOut) * (t > 2.95 ? .45 : 1), blur: m.blur + mOut * 10, x: -mOut * 700 });
    $("wMeslek").style.textShadow = gl && rnd(Math.floor(t * 30)) > .3
      ? `${(rnd(t * 30 + 1) - .5) * 40}px 0 rgba(255,59,107,.9), ${(rnd(t * 30 + 2) - .5) * -40}px 0 rgba(61,220,151,.9)` : "none";
    if (gl && rnd(Math.floor(t * 30) + 7) > .5) $("wMeslek").style.transform += ` translateX(${(rnd(t * 30 + 3) - .5) * 50}px)`;
    // çizgi
    const sk = eo(p(t, 2.75, 3.0));
    $("strike").style.width = "780px";
    set("strike", { sx: sk, sy: 1, o: (t > 2.75 ? 1 : 0) * (1 - mOut), x: -mOut * 700 });

    // MESLEĞİN sağdan gelir
    const mg = eo(p(t, 3.4, 3.75));
    set("wMeslegin", { x: (1 - mg) * 700, o: mg * out.o, blur: (1 - mg) * 12 + out.blur, y: out.y });

    // BİTTİ.: slam, sonra aşağı iner, ANGARYASI araya girer
    const b = slam(t, 1.55);
    const dn = eio(p(t, 3.6, 3.95));
    const out2 = leave(t, 5.25);
    set("wBitti", { s: b.s, o: b.o * out2.o, blur: b.blur + out2.blur, y: dn * 190 + out2.y });
    const ag = p(t, 3.7, 4.0);
    const out3 = leave(t, 5.2);
    set("wAngarya", { s: lerp(2.2, 1, ex(ag)), o: cl(ag * 3) * out3.o, blur: (1 - ag) * 16 + out3.blur, y: out3.y });
  }

  // ================= S3 (5.5 – 8.5) =================
  show("s3", t > 5.4 && t < 8.6);
  if (t > 5.4 && t < 8.6) {
    const A = [["s3a0", 5.5], ["s3a1", 5.65], ["s3a2", 5.85]];
    A.forEach(([id, a], i) => { const r = rise(t, a), l = leave(t, 6.85 + i * .05, .3); set(id, { y: r.y + l.y, o: r.o * l.o, blur: r.blur + l.blur }); });
    const B = [["s3b0", 7.05], ["s3b1", 7.2], ["s3b2", 7.4]];
    B.forEach(([id, a], i) => {
      const r = rise(t, a), l = leave(t, 8.25 + i * .04, .25);
      const pop = id === "s3b2" ? 1 + Math.sin(p(t, 7.4, 7.8) * Math.PI) * .12 : 1;
      set(id, { y: r.y + l.y, o: r.o * l.o, blur: r.blur + l.blur, s: pop });
    });
  }

  // ================= S4 (8.5 – 14) =================
  show("s4", t > 8.45 && t < 14.2);
  if (t > 8.45 && t < 14.2) {
    const exitK = eio(p(t, 13.6, 14.1));
    const h = rise(t, 8.5); set("s4h", { y: h.y - exitK * 200, o: h.o * (1 - exitK), blur: h.blur });
    cards.forEach((c, i) => {
      const a = CARD_T0 + i * CARD_DT;
      const k = p(t, a, a + .4);
      const ce = back(k);
      const ex2 = eio(p(t, 13.6 + i * .025, 13.95 + i * .025));
      set(c, { x: (1 - ce) * (i % 2 ? 900 : -900) + ex2 * (i % 2 ? -1100 : 1100), r: (1 - eo(k)) * (i % 2 ? 6 : -6), o: cl(k * 4), s: 1 });
      const tick = eo(p(t, a + .3, a + .55));
      const path = c.querySelector("path");
      path.setAttribute("stroke-dashoffset", 40 * (1 - tick));
      const ic = c.querySelector(".ic");
      const col = TASKS[i][1] === "k" ? "61,220,151" : "167,139,250";
      ic.style.borderColor = tick > .05 ? `rgba(${col},${.3 + tick * .7})` : "rgba(255,255,255,.18)";
      ic.style.background = `rgba(${col},${tick * .14})`;
    });
    const mr = rise(t, CARD_T0 + TASKS.length * CARD_DT + .2);
    set("s4more", { y: mr.y + exitK * 200, o: mr.o * (1 - exitK), blur: mr.blur });
  }

  // ================= S5 (14 – 18.2) =================
  show("s5", t > 13.95 && t < 18.4);
  if (t > 13.95 && t < 18.4) {
    const exitK = p(t, 17.85, 18.3);
    [[466, 14.05], [226, 14.35], [16, 14.65]].forEach(([n, a], i) => {
      const el = $("st" + i);
      const k = p(t, a, a + .9);
      el.querySelector(".v").textContent = Math.round(n * ex(k));
      const r = rise(t, a, .4);
      const l = leave(t, 17.85 + i * .05, .35);
      set(el, { x: (1 - eo(p(t, a, a + .45))) * -120, y: r.y + l.y, o: r.o * l.o, blur: r.blur + l.blur });
    });
    ["c0", "c1", "c2"].forEach((id, i) => {
      const k = p(t, 15.7 + i * .18, 16.1 + i * .18);
      const l = leave(t, 17.95, .3);
      set(id, { s: lerp(.4, 1, back(k)), o: cl(k * 3) * l.o, y: l.y });
    });
    void exitK;
  }

  // ================= S6 (18.2 – 22) =================
  show("s6", t > 18.2);
  if (t > 18.2) {
    const ck = p(t, 18.25, 18.75);
    set("cup", { s: lerp(.3, 1, back(ck)), o: cl(ck * 3), y: Math.sin(t * 2) * 6 });
    ["st_a", "st_b", "st_c"].forEach((id, i) => {
      const ph = (t * .9 + i * .33) % 1;
      set(id, { y: -ph * 40, o: Math.sin(ph * Math.PI) * cl((t - 18.5) * 3) });
    });
    const a = rise(t, 18.55), b = rise(t, 19.2);
    set("s6a", a);
    const pop = 1 + Math.sin(p(t, 19.2, 19.65) * Math.PI) * .1;
    set("s6b", { ...b, s: pop });
    set("logo", rise(t, 20.0));
    set("url", rise(t, 20.25));
  }
}
window.render = render;
window.DUR = DUR; window.FPS = FPS;

// ---- ses: müzik 3.85'teki dönüşte "drop" yapar; efektler sahne zamanlarına bağlı (synth.mjs) ----
const counterTicks = (a, d, n, step) => {
  const out = [];
  for (let v = step; v < n; v += step) out.push([a + d * -Math.log2(1 - v / n) / 10, "tick", .14, 2000 + v * 4]);
  return out;
};
window.AUDIO = {
  music: { drop: 3.85, bpm: 120, end: DUR },
  cues: [
    ...counterTicks(0, .95, 226, 8),
    [.95, "pop", .35, 660],
    [1.08, "hit"], [1.6, "hit"],
    [2.0, "riser", 1.85],
    [2.25, "glitch", .5],
    [2.75, "swoosh"],
    [3.3, "whoosh", .4, .3],
    [3.85, "bigHit"],
    [5.15, "whoosh", .45, .35],
    [5.65, "pop", .2, 520], [5.85, "pop", .2, 660],
    [6.85, "whoosh", .35, .3],
    [7.2, "pop", .2, 520], [7.4, "pop", .28, 880],
    [8.25, "whoosh", .4, .35],
    ...TASKS.flatMap((_, i) => { const a = CARD_T0 + i * CARD_DT; return [[a, "whoosh", .25, .18], [a + .32, "pop", .22, TASKS[i][1] === "k" ? 990 : 1320]]; }),
    [13.6, "whoosh", .45, .4],
    ...counterTicks(14.05, .9, 466, 30),
    [15.7, "pop", .25, 784], [15.88, "pop", .25, 988], [16.06, "pop", .25, 1175],
    [17.85, "whoosh", .45, .35],
    [18.3, "pop", .3, 523],
    [19.2, "chime"],
    [20.0, "pop", .2, 1046],
  ],
};

// önizleme: tarayıcıda açınca oynat (render.mjs ?render ile açar)
if (!location.search.includes("render")) {
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
} else render(0);
</script>
</body></html>
