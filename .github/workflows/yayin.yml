name: Kontrol ve yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Art arda push'larda GitHub Pages yayınları çakışmasın
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kontrol:
    name: Kontrol (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Bağımlılıklar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          for f in library/*/*/requirements.txt; do pip install -r "$f"; done
      - name: Standart kontrolü ve testler
        run: python scripts/kontrol.py --test

  guvenlik:
    name: Bağımlılık güvenlik taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: pip-audit
        run: |
          for f in library/*/*/requirements.txt; do echo "== $f"; pip-audit -r "$f" --strict; done

  derle:
    name: Siteyi derle
    needs: [kontrol, guvenlik]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: derle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
